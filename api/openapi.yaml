      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleDraftDto"
      responses:
        "200":
          description: ""
      tags: &a8
        - Scheduling
      security: &a9
        - bearer: []
  /v1/scheduling:
    get:
      operationId: SchedulingController_listScheduled
      summary: List all pending scheduled messages
      parameters: []
      responses:
        "200":
          description: ""
      tags: *a8
      security: *a9
  /v1/scheduling/{id}:
    delete:
      operationId: SchedulingController_cancelScheduled
      summary: Cancel a pending scheduled message
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a8
      security: *a9
  /v1/sync/pull:
    get:
      operationId: SyncController_pull
      summary: Pull delta changes since last sync cursor (Cursor-based pagination)
      parameters:
        - name: accountId
          required: false
          in: query
          schema:
            example: 018f0000-0000-7000-8000-000000000010
            type: string
        - name: cursor
          required: false
          in: query
          schema:
            example: 2026-10-13T12:00:00.000Z
            type: string
      responses:
        "200":
          description: ""
      tags: &a10
        - Sync
      security:
        - bearer: []
  /v1/sync/push:
    post:
      operationId: SyncController_push
