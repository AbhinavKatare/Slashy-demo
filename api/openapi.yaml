info:
  title: Inbox Companion API
  description: Secure, offline-first personal AI email assistant API. Full support
    for OIDC, rotating refresh tokens, RLS data isolation, outbox queue replay,
    and local search.
  version: 1.0.0
  contact: {}
tags:
  - name: Auth
    description: OIDC authentication, session management, and token rotation
  - name: Accounts
    description: Connected mailbox accounts (Google, Microsoft)
  - name: Mail
    description: Threads, messages, message bodies, and sending
  - name: Drafts
    description: Autosaved drafts and reply compositions
  - name: Scheduling
    description: Scheduled email sends with timezone support
  - name: Sync
    description: Cursor-based delta pull and idempotent outbox mutations
  - name: Search
    description: Full-text search with ranking and highlighting
  - name: Calendar
    description: Calendar events, date ranges, and meeting links
  - name: Tasks
    description: Action items linked to email threads
  - name: AI
    description: Zero-PII-persistence thread summaries and drafted replies
  - name: Notifications
    description: Device push notification tokens
  - name: Admin
    description: System metrics, health, and audit logs
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    OidcLoginDto:
      type: object
      properties:
        provider:
          type: string
          enum:
            - google
            - microsoft
          example: google
        idToken:
          type: string
          description: OIDC Identity Token issued by provider
          example: eyJhbGciOiJSUzI1NiIs...
        deviceName:
          type: string
          example: Alex's Pixel 9 Pro
        platform:
          type: string
          example: android
        appVersion:
          type: string
          example: 1.0.0
        pushToken:
          type: string
          example: fcm_push_token_xyz
      required:
        - provider
        - idToken
    AuthTokensResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1Ni...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1Ni...
        expiresIn:
          type: number
          example: 900
          description: Access token expiration in seconds (15 minutes)
        user:
          type: object
          example:
            id: 018f0000-0000-7000-8000-000000000001
            email: alex.morgan@example.com
            displayName: Alex Morgan
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Active rotating refresh token
          example: eyJhbGciOiJIUzI1Ni...
      required:
        - refreshToken
    SessionResponseDto:
      type: object
      properties:
        id:
          type: string
          example: 018f0000-0000-7000-8000-000000000030
        deviceName:
          type: string
          example: Alex's Pixel 9 Pro
        platform:
          type: string
          example: android
        ipAddress:
          type: string
          example: 192.168.1.100
        userAgent:
          type: string
          example: InboxCompanion/1.0.0 (Android 14)
        createdAt:
          type: string
          example: 2026-10-13T12:00:00Z
        lastActiveAt:
          type: string
          example: 2026-10-13T12:30:00Z
        isCurrent:
          type: boolean
          example: true
      required:
        - id
        - createdAt
        - lastActiveAt
        - isCurrent
    ConnectCallbackDto:
      type: object
      properties:
        provider:
          type: string
          enum:
            - google
            - microsoft
          example: google
        code:
          type: string
          description: Authorization code returned by provider
        codeVerifier:
          type: string
          description: PKCE code_verifier generated before launching auth flow
        state:
          type: string
          description: State parameter for CSRF validation
        redirectUri:
          type: string
          example: inboxcompanion://oauth/callback
      required:
        - provider
        - code
        - codeVerifier
        - state
        - redirectUri
    DisconnectAccountDto:
      type: object
      properties:
        purgeData:
          type: boolean
          default: true
          description: Purge all cached emails, threads and drafts
    UpdateThreadDto:
      type: object
      properties:
        isStarred:
          type: boolean
          example: true
        isUnread:
          type: boolean
          example: false
        folder:
          type: string
          example: archive
    ModifyThreadActionDto:
      type: object
      properties:
        action:
          type: string
          enum:
            - mark_read
            - mark_unread
            - star
            - unstar
            - archive
            - trash
            - apply_label
            - remove_label
          example: mark_read
        labelName:
          type: string
          example: Finance
        eTag:
          type: string
          description: Optimistic concurrency ETag or updated_at version token
      required:
        - action
    BulkModifyThreadsDto:
      type: object
      properties:
        threadIds:
          example:
            - thread-1
            - thread-2
          type: array
          items:
            type: string
        action:
          type: string
          enum:
            - mark_read
            - mark_unread
            - star
            - unstar
            - archive
            - trash
            - apply_label
            - remove_label
          example: archive
        labelName:
          type: string
          example: Receipts
      required:
        - threadIds
        - action
    RecipientDto:
      type: object
      properties:
        name:
          type: string
          example: Alex Morgan
        email:
          type: string
          example: alex@example.com
      required:
        - name
        - email
    SendMessageDto:
      type: object
      properties:
        accountId:
          type: string
          example: 018f0000-0000-7000-8000-000000000010
        to:
          type: array
          items:
            $ref: "#/components/schemas/RecipientDto"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/RecipientDto"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/RecipientDto"
        subject:
          type: string
          example: Project Update
        bodyPlain:
          type: string
          example: Hello team, here is the latest update.
        bodyHtml:
          type: string
          example: <p>Hello team, here is the latest update.</p>
        replyToThreadId:
          type: string
      required:
        - accountId
        - to
        - subject
        - bodyPlain
    CreateLabelDto:
      type: object
      properties:
        accountId:
          type: string
          example: 018f0000-0000-7000-8000-000000000010
        name:
          type: string
          example: Finance
        colorHex:
          type: string
          example: "#10B981"
      required:
        - accountId
        - name
        - colorHex
    CreateDraftDto:
      type: object
      properties:
        accountId:
          type: string
          example: 018f0000-0000-7000-8000-000000000010
        replyThreadId:
          type: string
        replyMessageId:
          type: string
        toRecipients:
          type: array
          items:
            $ref: "#/components/schemas/RecipientDto"
        ccRecipients:
          type: array
          items:
            $ref: "#/components/schemas/RecipientDto"
        bccRecipients:
          type: array
          items:
            $ref: "#/components/schemas/RecipientDto"
        subject:
          type: string
          example: Quarterly Planning
        bodyPlain:
          type: string
          example: Here are the draft notes...
        bodyHtml:
          type: string
          example: <p>Here are the draft notes...</p>
        attachmentsMeta:
          example: &a20 []
          type: array
          items:
            type: string
      required:
        - accountId
    UpdateDraftDto:
      type: object
      properties:
        accountId:
          type: string
          example: 018f0000-0000-7000-8000-000000000010
        replyThreadId:
          type: string
        replyMessageId:
          type: string
        toRecipients:
          type: array
          items:
            $ref: "#/components/schemas/RecipientDto"
        ccRecipients:
          type: array
          items:
            $ref: "#/components/schemas/RecipientDto"
        bccRecipients:
          type: array
          items:
            $ref: "#/components/schemas/RecipientDto"
        subject:
          type: string
          example: Quarterly Planning
        bodyPlain:
          type: string
          example: Here are the draft notes...
        bodyHtml:
          type: string
          example: <p>Here are the draft notes...</p>
        attachmentsMeta:
          example: *a20
          type: array
          items:
            type: string
      required:
        - accountId
    SendDraftDto:
      type: object
      properties:
        draftId:
          type: string
          description: ID of the draft to send
        payloadHash:
          type: string
          description: SHA-256 hex hash of the final reviewed payload to ensure user
            reviewed exact content
          example: a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3
        undoWindowSeconds:
          type: number
          description: Undo window duration in seconds (0 to 30s). Defaults to 10s
          default: 10
          minimum: 0
          maximum: 30
        scheduledAt:
          type: string
          description: Scheduled send timestamp (ISO-8601 UTC)
          example: 2026-10-15T09:00:00.000Z
        timezone:
          type: string
          description: Client timezone identifier for scheduled send (e.g.
            "America/New_York", "UTC")
          default: UTC
        followUpIfNoReplyDays:
          type: number
          description: Automatically trigger a reminder if no reply is received within N
            days
          example: 3
        reminderAt:
          type: string
          description: Explicit reminder timestamp for this thread (ISO-8601)
      required:
        - draftId
        - payloadHash
    UploadAttachmentDto:
      type: object
      properties:
        filename:
          type: string
          example: financial_report.pdf
        contentType:
          type: string
          example: application/pdf
        base64Data:
          type: string
          description: Base64 encoded binary file content
      required:
        - filename
        - contentType
        - base64Data
    ScheduleDraftDto:
      type: object
      properties:
        accountId:
          type: string
          example: 018f0000-0000-7000-8000-000000000010
        draftId:
          type: string
          example: 018f0000-0000-7000-8000-000000000020
        scheduledAt:
          type: string
          example: 2026-10-15T09:00:00Z
        timezone:
          type: string
          example: America/New_York
          default: UTC
      required:
        - accountId
        - draftId
        - scheduledAt
    OutboxItemDto:
      type: object
      properties:
        idempotencyKey:
          type: string
          example: op-018f0000-0000-7000
        accountId:
          type: string
          example: 018f0000-0000-7000-8000-000000000010
        actionType:
          type: string
          example: mark_read
          enum:
            - mark_read
            - mark_unread
            - star
            - unstar
            - archive
            - trash
        targetId:
          type: string
          example: 018f0000-0000-7000-8000-000000000020
        payload:
          type: object
          example: {}
      required:
        - idempotencyKey
        - accountId
        - actionType
        - targetId
    PushOutboxBatchDto:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: "#/components/schemas/OutboxItemDto"
      required:
        - operations
    CreateCalendarEventDto:
      type: object
      properties:
        accountId:
          type: string
          example: 018f0000-0000-7000-8000-000000000010
        title:
          type: string
          example: Product Sync & Design Review
        description:
          type: string
          example: Discuss Q4 roadmap and design iterations
        location:
          type: string
          example: Conference Room B / Virtual
        joinUrl:
          type: string
          example: https://meet.google.com/abc-defg-hij
        startTime:
          type: string
          example: 2026-10-15T14:00:00Z
        endTime:
          type: string
          example: 2026-10-15T15:00:00Z
        isAllDay:
          type: boolean
          default: false
        attendees:
          example:
            - alex@example.com
            - taylor@example.com
          type: array
          items:
            type: string
      required:
        - accountId
        - title
        - startTime
        - endTime
    CreateTaskDto:
      type: object
      properties:
        title:
          type: string
          example: Review sales deck before customer call
        threadId:
          type: string
          example: 018f0000-0000-7000-8000-000000000020
        dueDate:
          type: string
          example: 2026-10-18T17:00:00Z
      required:
        - title
    UpdateTaskDto:
      type: object
      properties:
        title:
          type: string
          example: Review sales deck before customer call
        isCompleted:
          type: boolean
          example: true
        dueDate:
          type: string
          example: 2026-10-19T17:00:00Z
    SummarizeThreadDto:
      type: object
      properties:
        threadId:
          type: string
          example: 018f0000-0000-7000-8000-000000000020
        redactPii:
          type: boolean
          description: Mask email addresses and phone numbers before AI processing
          default: true
      required:
        - threadId
    GenerateReplyDto:
      type: object
      properties:
        threadId:
          type: string
          example: 018f0000-0000-7000-8000-000000000020
        tone:
          type: string
          example: professional
          enum:
            - professional
            - friendly
            - concise
            - casual
          default: professional
        userPrompt:
          type: string
          example: Confirm availability for Friday at 2 PM
        redactPii:
          type: boolean
          description: Mask email addresses and phone numbers before AI processing
          default: true
      required:
        - threadId
    AdjustToneDto:
      type: object
      properties:
        text:
          type: string
          example: Please send me the report ASAP.
        targetTone:
          type: string
          example: friendly
          enum:
            - professional
            - friendly
            - concise
            - casual
      required:
        - text
        - targetTone
    TranscribeAssistDto:
      type: object
      properties:
        rawDictation:
          type: string
          description: Raw transcribed voice dictation text to convert into an email draft
          example: hey Alex let us meet next Tuesday around two pm to go over the budget
            and slides thanks
        tone:
          type: string
          example: professional
          enum:
            - professional
            - friendly
            - concise
            - casual
          default: professional
      required:
        - rawDictation
    RegisterNotificationTokenDto:
      type: object
      properties:
        token:
          type: string
          example: fcm_token_xyz123
        platform:
          type: string
          example: android
          enum:
            - android
            - ios
            - web
        deviceId:
          type: string
          example: 018f0000-0000-7000-8000-000000000030
      required:
        - token
        - platform
    UnregisterNotificationTokenDto:
      type: object
      properties:
        token:
          type: string
          example: fcm_token_xyz123
      required:
        - token
