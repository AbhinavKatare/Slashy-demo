      operationId: SyncController_getSyncStatus
      summary: Get current sync status, cursor state, and counts for an account
      parameters:
        - name: accountId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a10
      security:
        - bearer: []
  /v1/sync/webhooks/google:
    post:
      operationId: SyncController_handleGoogleWebhook
      summary: Google Cloud Pub/Sub Push Notification receiver for Gmail watch
