        - Drafts
      security: &a7
        - bearer: []
    post:
      operationId: DraftsController_createDraft
      summary: Create a new draft
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftDto"
      responses:
        "201":
          description: ""
      tags: *a6
      security: *a7
  /v1/drafts/{id}:
    get:
      operationId: DraftsController_getDraft
      summary: Get draft by ID
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a6
      security: *a7
    put:
      operationId: DraftsController_updateDraft
      summary: Update an existing draft
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDraftDto"
      responses:
        "200":
          description: ""
      tags: *a6
      security: *a7
    delete:
      operationId: DraftsController_deleteDraft
      summary: Delete a draft
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a6
      security: *a7
  /v1/drafts/{id}/send:
    post:
      operationId: DraftsController_sendDraft
      summary: Explicitly send a draft with user review hash, undo window, and
        scheduled send support
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: idempotency-key
          required: true
          in: header
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: Unique client key to prevent double submissions
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendDraftDto"
      responses:
        "202":
          description: ""
      tags: *a6
      security: *a7
  /v1/drafts/send/{sendId}/cancel:
    post:
      operationId: DraftsController_cancelSend
      summary: Cancel a pending send during the undo window or before scheduled time
      parameters:
        - name: sendId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a6
      security: *a7
  /v1/drafts/attachments/upload:
    post:
      operationId: DraftsController_uploadAttachment
      summary: Upload draft attachment with size, type limits and malware scanning
