      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadAttachmentDto"
      responses:
        "201":
          description: ""
      tags: *a6
      security: *a7
  /v1/scheduling/send:
    post:
      operationId: SchedulingController_scheduleDraft
