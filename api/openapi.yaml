      responses:
        "200":
          description: ""
      tags: *a10
  /v1/sync/webhooks/microsoft:
    get:
      operationId: SyncController_handleMicrosoftHandshake
      summary: Microsoft Graph webhook handshake validation token echo
      parameters:
        - name: validationToken
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a10
    post:
      operationId: SyncController_handleMicrosoftWebhook
      summary: Microsoft Graph Change Notification receiver
      parameters:
        - name: validationToken
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a10
  /v1/search:
    get:
      operationId: SearchController_search
      summary: Full-text search across mail threads
      parameters:
        - name: q
          required: true
          in: query
          schema:
            example: launch update
            type: string
        - name: accountId
          required: false
          in: query
          schema:
            example: 018f0000-0000-7000-8000-000000000010
            type: string
        - name: limit
          required: false
          in: query
          schema:
            default: 20
            type: number
      responses:
        "200":
          description: ""
      tags:
        - Search
      security:
        - bearer: []
  /v1/calendar/events:
