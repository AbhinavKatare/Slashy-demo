openapi: 3.0.0
paths:
  /v1/auth/google/url:
    get:
      operationId: AuthController_getGoogleAuthUrl
      summary: Get Google OIDC authorization URL for Custom Tabs
      parameters:
        - name: state
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Authorization URL
      tags: &a1
        - Auth
  /v1/auth/microsoft/url:
    get:
      operationId: AuthController_getMicrosoftAuthUrl
      summary: Get Microsoft OIDC authorization URL for Custom Tabs
      parameters:
        - name: state
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Authorization URL
      tags: *a1
  /v1/auth/oidc/login:
    post:
      operationId: AuthController_login
      summary: Login via OIDC identity token (Google / Microsoft)
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcLoginDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokensResponseDto"
      tags: *a1
  /v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      summary: Rotate refresh token and issue new token pair
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDto"
      responses:
        "200":
          description: Rotated token pair
      tags: *a1
  /v1/auth/logout:
    post:
      operationId: AuthController_logout
      summary: Logout and revoke current device session
      parameters: []
      responses:
        "200":
          description: ""
      tags: *a1
      security:
        - bearer: []
  /v1/auth/sessions:
    get:
      operationId: AuthController_listSessions
      summary: List all active sessions for current user
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionResponseDto"
      tags: *a1
      security:
        - bearer: []
  /v1/auth/sessions/{id}:
    delete:
      operationId: AuthController_revokeSession
      summary: Revoke a specific device session
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a1
      security:
        - bearer: []
  /v1/auth/revoke-all:
    post:
      operationId: AuthController_revokeAll
      summary: Revoke all sessions for current user across all devices
      parameters: []
      responses:
        "201":
          description: ""
      tags: *a1
      security:
        - bearer: []
  /v1/accounts:
    get:
      operationId: AccountsController_listAccounts
      summary: List all connected accounts for authenticated user
      parameters: []
      responses:
        "200":
          description: ""
      tags: &a2
        - Accounts
      security: &a3
        - bearer: []
  /v1/accounts/connect/url:
    get:
      operationId: AccountsController_getConnectUrl
      summary: Generate OAuth authorization URL with PKCE and requested scope tier
      parameters:
        - name: provider
          required: true
          in: query
          schema:
            example: google
            enum:
              - google
              - microsoft
            type: string
        - name: tier
          required: false
          in: query
          schema:
            default: readonly
            enum:
              - readonly
              - modify_send
            type: string
        - name: redirectUri
          required: true
          in: query
          schema:
            example: inboxcompanion://oauth/callback
            type: string
      responses:
        "200":
          description: ""
      tags: *a2
      security: *a3
  /v1/accounts/connect/callback:
    post:
      operationId: AccountsController_connectCallback
      summary: Exchange OAuth authorization code + PKCE verifier and store
        envelope-encrypted tokens
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectCallbackDto"
      responses:
        "200":
          description: ""
      tags: *a2
      security: *a3
  /v1/accounts/{id}:
    get:
      operationId: AccountsController_getAccount
      summary: Get details of a connected account
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a2
      security: *a3
    delete:
      operationId: AccountsController_disconnectAccount
      summary: Disconnect and purge account data
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a2
      security: *a3
  /v1/accounts/{id}/disconnect:
    post:
      operationId: AccountsController_disconnect
      summary: Disconnect account, revoke provider token, and optionally purge data
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisconnectAccountDto"
      responses:
        "200":
          description: ""
      tags: *a2
      security: *a3
  /v1/threads:
    get:
      operationId: MailController_listThreads
      summary: List threads with pagination, folder, or account filter
      parameters:
        - name: folder
          required: false
          in: query
          schema:
            example: inbox
            type: string
        - name: accountId
          required: false
          in: query
          schema:
            example: 018f0000-0000-7000-8000-000000000010
            type: string
        - name: labelId
          required: false
          in: query
          schema:
            type: string
        - name: isUnread
          required: false
          in: query
          schema:
            type: boolean
        - name: cursor
          required: false
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            default: 20
            type: number
      responses:
        "200":
          description: ""
      tags: &a4
        - Mail
      security: &a5
        - bearer: []
  /v1/threads/{id}:
    get:
      operationId: MailController_getThread
      summary: Get thread details and all constituent messages
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a4
      security: *a5
    patch:
      operationId: MailController_updateThread
      summary: Update thread flags or folder
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateThreadDto"
      responses:
        "200":
          description: ""
      tags: *a4
      security: *a5
    delete:
      operationId: MailController_deleteThread
      summary: Move thread to trash
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a4
      security: *a5
  /v1/threads/{id}/modify:
    patch:
      operationId: MailController_modifyThread
      summary: Modify thread (read/unread, star, archive, trash, label) requiring
        Idempotency-Key with provider confirmation
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: idempotency-key
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyThreadActionDto"
      responses:
        "200":
          description: ""
      tags: *a4
      security: *a5
  /v1/threads/bulk:
    post:
      operationId: MailController_bulkModifyThreads
      summary: Perform bulk actions across multiple threads requiring Idempotency-Key
      parameters:
        - name: idempotency-key
          required: true
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkModifyThreadsDto"
      responses:
        "200":
          description: ""
      tags: *a4
      security: *a5
  /v1/operations/{id}:
    get:
      operationId: MailController_getOperationStatus
      summary: Poll status and result of an outbox write operation
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a4
      security: *a5
  /v1/operations/{id}/undo:
    post:
      operationId: MailController_undoOperation
      summary: Undo an operation by executing its inverse action
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a4
      security: *a5
  /v1/mail/send:
    post:
      operationId: MailController_sendMessage
      summary: Send an email message
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageDto"
      responses:
        "200":
          description: ""
      tags: *a4
      security: *a5
  /v1/labels:
    get:
      operationId: MailController_listLabels
      summary: List mail labels
      parameters:
        - name: accountId
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a4
      security: *a5
    post:
      operationId: MailController_createLabel
      summary: Create a new mail label
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLabelDto"
      responses:
        "201":
          description: ""
      tags: *a4
      security: *a5
  /v1/drafts:
    get:
      operationId: DraftsController_listDrafts
      summary: List all message drafts
      parameters:
        - name: accountId
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
