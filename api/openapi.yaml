          required: false
          in: query
          schema:
            example: 2026-10-31T23:59:59Z
            type: string
        - name: accountId
          required: false
          in: query
          schema:
            example: 018f0000-0000-7000-8000-000000000010
            type: string
      responses:
        "200":
          description: ""
      tags: &a11
        - Calendar
      security: &a12
        - bearer: []
    post:
