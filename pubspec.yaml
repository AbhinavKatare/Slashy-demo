name: inbox_companion
description: "Inbox Companion - Production-grade Flutter email & productivity companion."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  dio: ^5.7.0
  uuid: ^4.5.1
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  intl: ^0.19.0
  equatable: ^2.0.5
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.24
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.0
  html: ^0.15.5
  path: ^1.9.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  drift_dev: ^2.24.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - api/openapi.yaml
